<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Rush</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- MENU -->
    <section class="menu" id="menu">
        <div class="menu-box">
            <div class="logo">🧠</div>
            <h1>MEMORY RUSH</h1>

            <button onclick="startGame()">PLAY NOW</button>
            <button class="how-btn" onclick="showHowToPlay()">HOW TO PLAY</button>
        </div>
    </section>

    <!-- GAME -->
    <section id="gameScreen">
        <div id="board" class="board"></div>
    </section>

    <!-- HOW TO PLAY -->
    <div id="howModal" class="how-modal">
        <div class="how-box">

            <h2>HOW TO PLAY</h2>
            <p id="stepText">Memorize the cards</p>

            <div class="demo-board">
                <div class="demo-card">🍎</div>
                <div class="demo-card">🍌</div>
                <div class="demo-card">🍎</div>
                <div class="demo-card">🍌</div>
            </div>

            <button onclick="closeHowToPlay()">CLOSE</button>
        </div>
    </div>

    <script src="game.js"></script>

</body>

</html>
