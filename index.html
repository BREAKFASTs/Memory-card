<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Rush</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->
    <section class="menu" id="menu">
        <h1>MEMORY RUSH</h1>
        <p>Train your memory under pressure</p>
        <button onclick="startGame()">PLAY</button>
    </section>

    <!-- GAME -->
    <section id="gameScreen">

        <div class="hud">
            <div>Score: <span id="score">0</span></div>
            <div>Pairs: <span id="pairs">0</span></div>
            <div>Level: <span id="level">Easy</span></div>
            <div>Time: <span id="time">30</span></div>
            <div>Best: <span id="best">0</span></div>
        </div>

        <div class="board" id="board"></div>
    </section>

    <!-- GAME OVER -->
    <section id="gameOver">
        <h1>GAME OVER</h1>
        <p>Score: <span id="finalScore"></span></p>
        <p>Pairs: <span id="finalPairs"></span></p>
        <p>Level Reached: <span id="finalLevel"></span></p>
        <p>Total Time Added: <span id="finalTime"></span></p>

        <button onclick="restart()">REPLAY</button>
    </section>

    <script src="game.js"></script>
</body>

</html>
